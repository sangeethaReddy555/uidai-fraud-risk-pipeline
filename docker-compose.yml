# Optional infrastructure: PostgreSQL + Kafka (KRaft, single node) + API + separate worker.
# NOTE: this file was NOT executed in the build environment (no Docker available). The code paths it
# exercises against a real broker (backend/app/kafka/real.py) are therefore unverified - see README.
# All credentials below are throwaway local-development values, not production secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk_dev_only
      POSTGRES_DB: risk
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  api:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
    environment: &env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://risk:risk_dev_only@postgres:5432/risk
      KAFKA_MODE: real
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMBEDDED_WORKER: "false"
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.main"]
    depends_on: [api]
    environment: *env
